<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PhoenixAI Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
    <style>
        html, body {
            font-family: var(--font-ui);
        }
        
        h1, h2, h3, h4, h5, h6,
        .stat-number {
            font-family: var(--font-display);
        }

        .search-result-group-title,
        .module-status,
        .module-order,
        .result-category,
        .templates-table td span {
            font-family: var(--font-accent);
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(194, 65, 12, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 15% 30%, rgba(124, 45, 18, 0.06) 0%, transparent 35%),
                linear-gradient(180deg, #050505 0%, #080706 45%, #0D0C0A 100%);
        }
        
        .admin-sidebar {
            width: 280px;
            background: linear-gradient(135deg, rgba(20, 17, 14, 0.85), rgba(8, 8, 7, 0.80));
            backdrop-filter: blur(28px);
            border-right: 1px solid rgba(255, 106, 0, 0.30);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.35);
            padding: 25px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .admin-logo {
            margin-bottom: 35px;
            text-align: center;
        }
        
        .admin-logo img {
            max-width: 180px;
            height: auto;
            border-radius: 8px;
        }
        
        .admin-logo .logo-container img {
            height: 100%;
            width: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        
        .logo-container {
            background: transparent;
            border: none;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
            padding: 4px 0;
            width: auto;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Groups (Content / Activity / System) — a labelled cluster with a
           little breathing room above it, instead of one flat list. */
        .admin-nav-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 14px;
        }

        .admin-nav-group-title {
            font-family: var(--font-accent);
            font-size: 0.72em;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.75);
            padding: 10px 18px 6px;
        }

        .admin-nav-item {
            background: transparent;
            border: none;
            border-left: 3px solid transparent;
            color: #D4D4D4;
            padding: 11px 14px;
            text-align: left;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
            font-size: 0.94em;
            letter-spacing: 0.2px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
        }

        .admin-nav-icon {
            flex-shrink: 0;
            opacity: 0.72;
            transition: opacity 0.2s ease;
        }

        .admin-nav-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .admin-nav-badge {
            flex-shrink: 0;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            background: rgba(255, 106, 0, 0.18);
            border: 1px solid rgba(255, 106, 0, 0.40);
            color: #FFB07A;
            font-size: 0.72em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
        }

        .admin-nav-item:hover {
            background: rgba(255, 106, 0, 0.10);
            color: #F5F5F5;
            transform: translateX(4px);
        }

        .admin-nav-item:hover .admin-nav-icon {
            opacity: 1;
        }

        .admin-nav-item.active {
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.15), rgba(194, 65, 12, 0.12));
            color: #F5F5F5;
            border: 1px solid rgba(255, 106, 0, 0.35);
            border-left: 3px solid var(--phoenix-orange);
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.15);
        }

        .admin-nav-item.active .admin-nav-icon {
            opacity: 1;
            color: var(--phoenix-orange);
        }

        .admin-nav-item.active .admin-nav-badge {
            background: rgba(255, 106, 0, 0.30);
            color: #FFF3E9;
        }
        
        .admin-content {
            flex: 1;
            margin-left: 280px;
            padding: 35px;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 35px;
            padding: 22px 0 25px;
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(180deg, rgba(5,5,5,0.97) 70%, rgba(5,5,5,0));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        
        .header-left {
            flex: 1;
        }
        
        .admin-header h1 {
            color: #F5F5F5;
            font-size: 2em;
            letter-spacing: 0.01em;
            font-weight: 400;
            margin-bottom: 8px;
        }
        
        .page-description {
            color: #A0A0A0;
            font-size: 0.95em;
            letter-spacing: 0.3px;
            margin: 0;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(13, 12, 10, 0.75);
            border: 1px solid rgba(255, 106, 0, 0.24);
            border-radius: 12px;
            padding: 10px 16px;
            width: 320px;
            transition: all 0.3s ease;
        }
        
        .search-container:focus-within {
            border-color: rgba(255, 106, 0, 0.50);
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.15);
        }
        
        .search-icon {
            color: #A0A0A0;
            flex-shrink: 0;
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #F5F5F5;
            font-size: 0.95em;
            padding: 0 12px;
            outline: none;
            letter-spacing: 0.3px;
        }
        
        .search-input::placeholder {
            color: #707070;
        }
        
        .search-clear {
            background: transparent;
            border: none;
            color: #A0A0A0;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .search-clear:hover {
            background: rgba(255, 106, 0, 0.20);
            color: #F5F5F5;
        }
        
        .search-results {
            position: fixed;
            top: 140px;
            right: 35px;
            width: 400px;
            max-height: 500px;
            background: linear-gradient(145deg, rgba(20, 17, 14, 0.95), rgba(8, 8, 7, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 106, 0, 0.30);
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.60);
            z-index: 1000;
            overflow: hidden;
        }

        .notification-container {
            position: relative;
        }

        .notification-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(13, 12, 10, 0.70);
            border: 1px solid rgba(255, 106, 0, 0.30);
            border-radius: 10px;
            color: #F5F5F5;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .notification-button:hover {
            background: rgba(255, 106, 0, 0.15);
            border-color: rgba(255, 106, 0, 0.50);
            color: var(--phoenix-orange);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 106, 0, 0.15);
        }

        .notification-button:active {
            transform: translateY(0);
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: var(--phoenix-orange);
            color: #0D0C0A;
            font-size: 11px;
            font-weight: 600;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 106, 0, 0.40);
        }

        .notification-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 380px;
            max-height: 450px;
            background: linear-gradient(135deg, rgba(20, 17, 14, 0.96), rgba(8, 8, 7, 0.94));
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 106, 0, 0.30);
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.60);
            z-index: 1000;
            display: none;
        }

        .notification-dropdown.active {
            display: block;
        }

        .notification-dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.20);
        }

        .notification-dropdown-header h3 {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: #F5F5F5;
            margin: 0;
        }

        .mark-all-read {
            background: transparent;
            border: none;
            color: var(--phoenix-orange);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mark-all-read:hover {
            text-decoration: underline;
        }

        .notification-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 8px;
        }

        .notification-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .notification-item:hover {
            background: rgba(255, 106, 0, 0.08);
            border-left-color: rgba(255, 106, 0, 0.40);
        }

        .notification-item.unread {
            background: rgba(255, 106, 0, 0.05);
            border-left-color: var(--phoenix-orange);
        }

        .notification-title {
            font-weight: 600;
            color: #F5F5F5;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .notification-message {
            color: #A0A0A0;
            font-size: 13px;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .notification-time {
            color: #707070;
            font-size: 12px;
        }

        .notification-dropdown-footer {
            padding: 12px 18px;
            border-top: 1px solid rgba(255, 106, 0, 0.20);
        }

        .notification-dropdown-footer a {
            color: var(--phoenix-orange);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .notification-dropdown-footer a:hover {
            text-decoration: underline;
        }

        .no-notifications {
            padding: 40px 20px;
            text-align: center;
            color: #707070;
            font-size: 14px;
        }

        .search-filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-filter-bar .search-input {
            flex: 1;
            min-width: 200px;
        }

        .filter-select {
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(25, 21, 17, 0.75), rgba(8, 8, 7, 0.68));
            border: 1px solid rgba(255, 106, 0, 0.25);
            border-radius: 10px;
            color: #F5F5F5;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .filter-select:hover {
            border-color: rgba(255, 106, 0, 0.40);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--phoenix-orange);
        }

        .filter-select option {
            background: #0D0C0A;
            color: #F5F5F5;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-new {
            background: rgba(255, 106, 0, 0.15);
            color: var(--phoenix-orange);
            border: 1px solid rgba(255, 106, 0, 0.30);
        }

        .status-contacted {
            background: rgba(194, 65, 12, 0.15);
            color: var(--ember-orange);
            border: 1px solid rgba(194, 65, 12, 0.30);
        }

        .status-qualified {
            background: rgba(255, 106, 0, 0.18);
            color: var(--fire-orange);
            border: 1px solid rgba(255, 106, 0, 0.40);
        }

        .status-converted {
            background: rgba(255, 106, 0, 0.20);
            color: var(--phoenix-orange);
            border: 1px solid rgba(255, 106, 0, 0.50);
        }

        .status-lost {
            background: rgba(127, 29, 29, 0.15);
            color: #FF8A7A;
            border: 1px solid rgba(220, 70, 50, 0.35);
        }

        .status-read {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .status-replied {
            background: rgba(194, 65, 12, 0.15);
            color: var(--ember-orange);
            border: 1px solid rgba(194, 65, 12, 0.30);
        }

        .status-closed {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .status-unread {
            background: rgba(255, 106, 0, 0.18);
            color: var(--phoenix-orange);
            border: 1px solid rgba(255, 106, 0, 0.40);
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .priority-low {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .priority-medium {
            background: rgba(255, 106, 0, 0.15);
            color: var(--phoenix-orange);
            border: 1px solid rgba(255, 106, 0, 0.30);
        }

        .priority-high {
            background: rgba(127, 29, 29, 0.15);
            color: #FF8A7A;
            border: 1px solid rgba(220, 70, 50, 0.35);
        }

        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        .type-lead {
            background: rgba(255, 106, 0, 0.15);
            color: var(--phoenix-orange);
            border: 1px solid rgba(255, 106, 0, 0.30);
        }

        .type-contact {
            background: rgba(194, 65, 12, 0.15);
            color: var(--ember-orange);
            border: 1px solid rgba(194, 65, 12, 0.30);
        }

        .type-system {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .unread-row {
            background: rgba(255, 106, 0, 0.05);
        }

        .inquiry-detail {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .detail-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-row strong {
            color: #A0A0A0;
            font-size: 13px;
            font-weight: 500;
        }

        .detail-row span {
            color: #F5F5F5;
            font-size: 14px;
        }

        .detail-row select {
            background: linear-gradient(135deg, rgba(25, 21, 17, 0.75), rgba(8, 8, 7, 0.68));
            border: 1px solid rgba(255, 106, 0, 0.25);
            border-radius: 8px;
            padding: 8px 12px;
            color: #F5F5F5;
            font-size: 14px;
            cursor: pointer;
        }

        .detail-row select option {
            background: #0D0C0A;
            color: #F5F5F5;
        }

        .message-text {
            background: rgba(20, 17, 14, 0.50);
            border: 1px solid rgba(255, 106, 0, 0.15);
            border-radius: 8px;
            padding: 16px;
            colo
