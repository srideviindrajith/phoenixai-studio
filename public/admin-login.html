<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>Admin Login - PhoenixAI Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <!--
        This page is intentionally self-contained (no /styles.css). The old page
        pulled in the 93 KB site stylesheet just for four colours, and it used a
        relative "styles.css" URL, so opening /admin/ (trailing slash) loaded
        the page with no styles at all.
    -->
    <style>
        :root {
            --phoenix-orange: #FF6A00;
            --deep-ember: #7C2D12;
            --text-primary: #F3ECE2;
            --card-bg: rgba(26, 21, 16, 0.82);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #050505; }

        body {
            font-family: var(--font-ui);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        input, button { font-family: inherit; }

        .admin-login-container {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(194, 65, 12, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 15% 30%, rgba(124, 45, 18, 0.06) 0%, transparent 35%),
                linear-gradient(180deg, #050505 0%, #080706 45%, #0D0C0A 100%);
        }

        /* Cinematic vignette (same look as the main site) */
        .admin-login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(5, 5, 5, 0.45) 100%);
            pointer-events: none;
        }

        .login-box {
            position: relative;
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 106, 0, 0.20);
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 106, 0, 0.12);
        }

        .login-box h1 {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 35px;
            font-size: 1.8em;
            letter-spacing: 2px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group { text-align: left; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #D4D4D4;
            font-weight: 500;
        }

        .password-field { position: relative; }

        .form-group input {
            width: 100%;
            padding: 14px 64px 14px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 106, 0, 0.20);
            border-radius: 8px;
            color: #F5F5F5;
            font-size: 1em;
            letter-spacing: 0.5px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--phoenix-orange);
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.2);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            color: #A3A3A3;
            font-size: 0.9em;
            cursor: pointer;
            user-select: none;
        }

        .remember-row input {
            width: 16px;
            height: 16px;
            accent-color: var(--phoenix-orange);
            cursor: pointer;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            color: #A3A3A3;
            font-size: 0.8em;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .toggle-password:hover,
        .toggle-password:focus-visible { color: var(--phoenix-orange); outline: none; }

        .login-button {
            background: var(--phoenix-orange);
            color: #F5F5F5;
            padding: 14px 35px;
            border: 1px solid rgba(255, 106, 0, 0.80);
            border-radius: 12px;
            font-weight: 600;
            font-size: 1em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
        }

        .login-button:hover:not(:disabled) {
            background: var(--deep-ember);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.4);
        }

        .login-button:focus-visible {
            outline: 2px solid var(--phoenix-orange);
            outline-offset: 3px;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error-message {
            color: var(--phoenix-orange);
            margin-top: 15px;
            font-size: 0.9em;
            min-height: 1.4em;
        }

        .noscript-message {
            color: var(--phoenix-orange);
            margin-top: 15px;
            font-size: 0.9em;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #A3A3A3;
            text-decoration: none;
            font-size: 0.9em;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .back-link:hover,
        .back-link:focus-visible { color: var(--phoenix-orange); }

        @media (max-width: 480px) {
            .login-box { padding: 40px 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="admin-login-container">
        <div class="login-box">
            <h1>Admin Login</h1>
            <form class="login-form" id="login-form" novalidate>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password"
                               autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="256"
                               required autofocus aria-describedby="error-message">
                        <button type="button" class="toggle-password" id="toggle-password"
                                aria-controls="password" aria-pressed="false">Show</button>
                    </div>
                </div>
                <label class="remember-row" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Keep me signed in for 12 hours</span>
                </label>
                <button type="submit" class="login-button" id="login-button">Login</button>
            </form>
            <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>
            <noscript><p class="noscript-message">JavaScript is required to sign in.</p></noscript>
            <a href="/" class="back-link">&larr; Back to Website</a>
        </div>
    </main>

    <script>
        (function () {
            var form = document.getElementById('login-form');
            var passwordInput = document.getElementById('password');
            var toggleButton = document.getElementById('toggle-password');
            var loginButton = document.getElementById('login-button');
            var errorMessage = document.getElementById('error-message');
            var submitting = false;

            toggleButton.addEventListener('click', function () {
                var show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                toggleButton.textContent = show ? 'Hide' : 'Show';
                toggleButton.setAttribute('aria-pressed', String(show));
                passwordInput.focus();
            });

            function setBusy(busy) {
                submitting = busy;
                loginButton.disabled = busy;
                loginButton.textContent = busy ? 'Signing in\u2026' : 'Login';
            }

            function showError(message) {
                errorMessage.textContent = message;
                passwordInput.focus();
                passwordInput.select();
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (submitting) return; // ignore double-clicks / repeated Enter

                var password = passwordInput.value;
                if (!password) {
                    showError('Please enter your password.');
                    return;
                }

                errorMessage.textContent = '';
                setBusy(true);

                // Don't hang forever if the server or network stalls.
                var controller = new AbortController();
                var timer = setTimeout(function () { controller.abort(); }, 15000);

                try {
                    var response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        cache: 'no-store',
                        body: JSON.stringify({ password: password, remember: document.getElementById('remember').checked }),
                        signal: controller.signal
                    });

                    // The body isn't guaranteed to be JSON (e.g. a host-level 502 page).
                    var data = null;
                    try { data = await response.json(); } catch (parseErr) { /* handled below */ }

                    if (response.ok && data && data.success) {
                        window.location.replace('/admin');
                        return; // keep the button disabled while navigating
                    }

                    if (data && data.error) {
                        showError(data.error);
                    } else if (response.status >= 500) {
                        showError('The server had a problem. Please try again in a moment.');
                    } else {
                        showError('Login failed. Please try again.');
                    }
                } catch (err) {
                    showError(err && err.name === 'AbortError'
                        ? 'The server took too long to respond. Please try again.'
                        : 'Could not reach the server. Check your connection and try again.');
                } finally {
                    clearTimeout(timer);
                }
                setBusy(false);
            });
        })();
    </script>
</body>
</html>
